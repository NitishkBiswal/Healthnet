services:
  postgres:
    image: postgres:16-alpine
    container_name: healthnet-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: healthnet
      POSTGRES_PASSWORD: healthnet_dev_password
      POSTGRES_DB: healthnet_db
    volumes:
      - healthnet_pgdata:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthnet -d healthnet_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - healthnet

  redis:
    image: redis:7-alpine
    container_name: healthnet-redis
    ports:
      - "6379:6379"
    volumes:
      - healthnet_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - healthnet

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: healthnet-keycloak
    ports:
      - "8180:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: healthnet
      KC_DB_PASSWORD: healthnet_dev_password
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev --import-realm
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - healthnet

  keycloak-bootstrap:
    image: quay.io/keycloak/keycloak:25.0
    container_name: healthnet-keycloak-bootstrap
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        sed 's/\r$//' /opt/keycloak/bootstrap-test-users.sh | exec /bin/bash
    volumes:
      - ./keycloak/bootstrap-test-users.sh:/opt/keycloak/bootstrap-test-users.sh:ro
    depends_on:
      keycloak:
        condition: service_started
    networks:
      - healthnet
    restart: "no"

  hapi-fhir-kolkata:
    image: hapiproject/hapi:latest
    container_name: healthnet-hapi-fhir-kolkata
    ports:
      - "8091:8080"
    environment:
      spring.datasource.url: jdbc:postgresql://postgres:5432/hapi_fhir_kolkata_db
      spring.datasource.username: healthnet
      spring.datasource.password: healthnet_dev_password
      spring.datasource.driverClassName: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      hapi.fhir.fhir_version: R4
      hapi.fhir.allow_external_references: "true"
      hapi.fhir.allow_multiple_delete: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/fhir/metadata || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - healthnet

  karnataka-db-init:
    image: postgres:16-alpine
    container_name: healthnet-karnataka-db-init
    environment:
      PGPASSWORD: healthnet_dev_password
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until pg_isready -h postgres -U healthnet -d postgres; do sleep 2; done
        if ! psql -h postgres -U healthnet -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='hapi_fhir_karnataka_db'" | grep -q 1; then
          psql -h postgres -U healthnet -d postgres -c "CREATE DATABASE hapi_fhir_karnataka_db"
        fi
        psql -h postgres -U healthnet -d postgres -c "GRANT ALL PRIVILEGES ON DATABASE hapi_fhir_karnataka_db TO healthnet"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - healthnet
    restart: "no"

  hapi-fhir-karnataka:
    image: hapiproject/hapi:latest
    container_name: healthnet-hapi-fhir-karnataka
    ports:
      - "8092:8080"
    environment:
      spring.datasource.url: jdbc:postgresql://postgres:5432/hapi_fhir_karnataka_db
      spring.datasource.username: healthnet
      spring.datasource.password: healthnet_dev_password
      spring.datasource.driverClassName: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      hapi.fhir.fhir_version: R4
      hapi.fhir.allow_external_references: "true"
      hapi.fhir.allow_multiple_delete: "true"
    depends_on:
      karnataka-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/fhir/metadata || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - healthnet

  hapi-fhir:
    image: hapiproject/hapi:latest
    container_name: healthnet-hapi-fhir
    ports:
      - "8090:8080"
    environment:
      spring.datasource.url: jdbc:postgresql://postgres:5432/hapi_fhir_db
      spring.datasource.username: healthnet
      spring.datasource.password: healthnet_dev_password
      spring.datasource.driverClassName: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      hapi.fhir.fhir_version: R4
      hapi.fhir.allow_external_references: "true"
      hapi.fhir.allow_multiple_delete: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/fhir/metadata || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - healthnet

volumes:
  healthnet_pgdata:
  healthnet_redis:

networks:
  healthnet:
    driver: bridge
